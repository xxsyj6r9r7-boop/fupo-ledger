<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ec4899" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="富婆专来记账 — 本地离线记账" />
  <title>富婆专来记账</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23ec4899' width='32' height='32' rx='6'/%3E%3Ctext x='16' y='22' font-size='14' fill='white' text-anchor='middle' font-family='system-ui'%3E记%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="app" class="ledger-tab">
    <header class="app-header">
      <h1 class="title">富婆专来记账啦</h1>
      <div id="header-date-wrap" class="header-date-wrap">
        <div class="date-row">
          <label for="entry-date">选择日期</label>
          <input type="date" id="entry-date" />
        </div>
      </div>
      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-page="ledger" role="tab" aria-selected="true">记账</button>
        <button type="button" class="tab" data-page="records" role="tab" aria-selected="false">明细</button>
      </nav>
    </header>

    <main class="pages">
      <!-- 记账页 -->
      <section id="page-ledger" class="page active" aria-label="记账">
        <p class="hint">点选分类后会弹出窗口输入金额与备注，确定后累加到账本。</p>

        <div class="avg-card" aria-live="polite">
          <div class="avg-card-head">
            <span class="avg-card-title">每日平均支出</span>
            <span class="avg-card-value" id="avg-daily-four">0.00</span>
          </div>
          <p class="avg-card-desc">
            统计当月「餐食/果蔬、零食、通讯、交通」四项合计，按本月已过天数均摊（元/天）。
          </p>
        </div>

        <div id="category-grid" class="category-grid"></div>

        <div class="day-records-wrap">
          <h2 class="subheading">当日记录 <span id="day-records-date"></span></h2>
          <ul id="day-records-list" class="record-list"></ul>
          <p id="day-records-empty" class="empty-tip hidden">该日暂无记录，可在上方添加。</p>
        </div>

        <div class="summary-card">
          <h2 class="subheading">汇总（实时）</h2>
          <dl class="summary-dl">
            <div><dt>当日支出合计</dt><dd id="sum-day">0.00</dd></div>
            <div><dt>本月支出合计</dt><dd id="sum-month">0.00</dd></div>
            <div><dt>上月支出合计</dt><dd id="sum-last-month">0.00</dd></div>
            <div><dt>本年截止今日支出合计</dt><dd id="sum-year">0.00</dd></div>
          </dl>
        </div>
      </section>

      <!-- 明细页 -->
      <section id="page-records" class="page" aria-label="明细" hidden>
        <div class="filters">
          <label class="field compact">
            <span>按年</span>
            <select id="filter-year"></select>
          </label>
          <label class="field compact">
            <span>按月</span>
            <select id="filter-month"></select>
          </label>
          <label class="field compact">
            <span>按日</span>
            <select id="filter-day"></select>
          </label>
          <button type="button" id="reset-filters" class="btn ghost">重置为全部</button>
        </div>
        <p id="records-count" class="records-meta"></p>
        <div id="records-groups" class="records-groups"></div>
        <p id="records-empty" class="empty-tip hidden">暂无符合条件的记录。</p>
      </section>
    </main>
  </div>

  <div id="entry-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="entry-modal-heading" aria-hidden="true">
    <button type="button" class="modal-backdrop" id="entry-modal-backdrop" tabindex="-1" aria-label="关闭弹窗"></button>
    <div class="modal-panel">
      <h2 id="entry-modal-heading" class="modal-heading">记一笔</h2>
      <p id="selected-cat-label" class="modal-cat"></p>
      <label class="field">
        <span>金额（元）</span>
        <input type="number" id="amount-input" inputmode="decimal" min="0" step="0.01" placeholder="0.00" />
      </label>
      <label class="field">
        <span>备注</span>
        <input type="text" id="note-input" maxlength="120" placeholder="可选" />
      </label>
      <button type="button" id="confirm-entry" class="btn primary">确定入账</button>
      <button type="button" id="clear-selection" class="btn ghost">取消</button>
    </div>
  </div>

  <script src="./script.js" defer></script>
</body>
</html>
